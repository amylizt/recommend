name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@v0.1.7  # Upgraded from @master to a stable release
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".*,**/*"                # Fixed: Targets all files and subdirectories
          target: "/var/www/recommend"
          strip_components: 0

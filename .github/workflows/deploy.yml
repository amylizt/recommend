name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Create SSH Directory
        run: mkdir -p ~/.ssh && chmod 700 ~/.ssh

      - name: Write SSH Private Key
        run: echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa

      - name: Scan Remote Host Key
        run: ssh-keyscan -H "${{ secrets.REMOTE_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Server via Native SCP
        run: scp -i ~/.ssh/id_rsa -r . "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/var/www/recommend"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Responsive Node.js Chat</title>
    <style>
          /* Base reset */
      * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Force the body to stay firmly fixed within the screen boundaries */
      html, body {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background-color: #f0f2f5;
      }

      /* MOBILE FIRST: Pin the container exactly to the edges of the visible screen */
      .chat-container {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          display: flex;
          flex-direction: column;
          background: #ffffff;
          width: 100%;
          height: 100%;
      }

      /* Chat Header - Locked at the top */
      .chat-header {
          background-color: #075e54;
          color: white;
          padding: 15px;
          font-size: 1.1rem;
          font-weight: bold;
          display: flex;
          align-items: center;
          gap: 10px;
          flex-shrink: 0;
      }

      .chat-header .status-dot {
          width: 10px;
          height: 10px;
          background-color: #25d366;
          border-radius: 50%;
      }

      /* Message Area - Independent scroll layer */
      .chat-messages {
          flex: 1;
          padding: 20px;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch; /* Smooth physics scrolling for iOS */
          background-color: #efeae2;
          display: flex;
          flex-direction: column;
          gap: 12px;
      }

      /* Message Bubbles */
      .message {
          max-width: 75%;
          padding: 10px 14px;
          border-radius: 8px;
          font-size: 0.95rem;
          line-height: 1.4;
          word-wrap: break-word;
      }

      .message.user {
          background-color: #d9fdd3;
          align-self: flex-end;
          border-top-right-radius: 0;
      }

      .message.ai {
          background-color: #ffffff;
          align-self: flex-start;
          border-top-left-radius: 0;
          box-shadow: 0 1px 1px rgba(0,0,0,0.05);
      }

      /* Input Area Footer - Locked at the absolute bottom */
      .chat-input-area {
          background-color: #f0f2f5;
          padding: 12px 15px;
          display: flex;
          gap: 10px;
          align-items: center;
          flex-shrink: 0;
          border-top: 1px solid #e1e6eb;
      }

      .chat-input-area input {
          flex: 1;
          padding: 12px 15px;
          border: 1px solid #e1e6eb;
          border-radius: 20px;
          outline: none;
          font-size: 16px; /* 16px strictly prevents iOS auto-zoom behavior */
      }

      .chat-input-area button {
          background-color: #075e54;
          color: white;
          border: none;
          padding: 12px 20px;
          border-radius: 20px;
          cursor: pointer;
          font-weight: bold;
          font-size: 0.95rem;
      }

      /* --- Responsive Media Queries: Override absolute fullscreen on larger devices --- */

      /* Tablets (iPads) */
      @media (min-width: 481px) and (max-width: 1024px) {
          body {
              display: flex;
              justify-content: center;
              align-items: center;
          }
          .chat-container {
              position: relative;
              width: 80%;
              height: 80vh;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
          }
      }

      /* Desktop Computers */
      @media (min-width: 1025px) {
          body {
              display: flex;
              justify-content: center;
              align-items: center;
          }
          .chat-container {
              position: relative;
              width: 450px;
              height: 700px;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
          }
      }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="status-dot"></div>
            <span>Node Latin AI</span>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">Salvete! Ask me anything, and I shall answer in Latin.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Show user message instantly
            appendMessage(text, 'user');
            userInput.value = '';

            try {
                // 2. Hit your Node.js Backend API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                
                // 3. Append the backend's response
                appendMessage(data.reply, 'ai');
            } catch (error) {
                console.error('Error contacting backend:', error);
                appendMessage('Error: Unabile to reach the server.', 'ai');
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
